name: Release to TestFlight

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - ".github/workflows/release-testflight.yml"

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Seçilen Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up temporary keychain
        run: |
          security create-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Import signing certificate
        env:
          CERT_DIST_P12_BASE64: ${{ secrets.CERT_DIST_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          set -e
          P12_PASSWORD=$(printf '%s' "$CERT_P12_PASSWORD" | tr -d '[:space:]')
          printf '%s' "$CERT_DIST_P12_BASE64" | tr -d '[:space:]' | base64 --decode > dist.p12
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm -f dist.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Geometrik_App_Store.mobileprovision

      # Manuel imzalama (project.yml#Release config) - API key'e/otomatik provizyona hiç gerek
      # yok, sertifika+profile zaten yerelde kurulu. Bkz. project.yml'deki not: bunun
      # "-authenticationKeyPath" ile otomatik imzalamadan daha güvenilir olduğu bu projede
      # denenip doğrulandı.
      - name: Archive (Release, manuel imzalama)
        run: |
          xcodebuild archive \
            -project Geometrik.xcodeproj \
            -scheme Geometrik \
            -configuration Release \
            -archivePath build/Geometrik.xcarchive \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export .ipa
        run: |
          cat > ExportOptions.plist << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>R6W7XU4TM7</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.geometrikapp.app</key>
              <string>Geometrik App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST_EOF
          xcodebuild -exportArchive \
            -archivePath build/Geometrik.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      # App Store Connect API key sadece burada, yükleme için kullanılıyor - kullanıcı adı/
      # şifre/2FA gerekmez.
      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -e
          mkdir -p ~/private_keys
          printf '%s' "$API_KEY_P8" > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          IPA_PATH=$(find build/export -maxdepth 1 -name "*.ipa" | head -1)
          echo "Yüklenecek IPA: $IPA_PATH"
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload build artifact (yedek/inceleme için)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Geometrik-release-ipa
          path: build/export/*.ipa
          retention-days: 14
