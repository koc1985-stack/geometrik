name: Geometrik
options:
  bundleIdPrefix: com.geometrikapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: tr
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "R6W7XU4TM7"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
targets:
  Geometrik:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Geometrik"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geometrikapp.app
        PRODUCT_NAME: "Geometrik"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # Manuel imzalama SADECE Release (Archive) config'inde, SADECE bu app target'ında -
      # Kozmika'da öğrenildi: xcodebuild archive'a komut satırından global verilirse veya proje
      # genelinde ayarlanırsa RevenueCat gibi SPM paket target'larına da sızıp "does not support
      # provisioning profiles" hatası verebiliyor. Ayrıca "-authenticationKeyPath" ile ARCHIVE
      # sırasında otomatik imzalama (yeni Xcode 26.6'da) "Authentication failed" hatası verdi -
      # bu yüzden gerçek bir provisioning profile ile manuel imzalamaya geçildi.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Geometrik App Store"
    dependencies:
      - package: RevenueCat
        product: RevenueCat

schemes:
  Geometrik:
    build:
      targets:
        Geometrik: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
